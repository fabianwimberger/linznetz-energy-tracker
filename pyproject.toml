[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linznetz-energy-tracker"
version = "1.5.5"
description = "Web application for graphical analysis of energy consumption from Austrian smart-meter CSV exports."
requires-python = ">=3.13"

dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "aiosqlite==0.22.1",
    "sqlalchemy[asyncio]==2.1.2",
    "python-dateutil==2.9.0.post0",
    "python-multipart==0.0.32",
    "aiofiles==25.1.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["app", "csv_import", "db_init", "linznetz_fetcher", "version"]

[tool.coverage.run]
omit = ["download_vendors.py"]

[tool.coverage.report]
fail_under = 85

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"app.py" = ["B008", "E741", "B904", "B905"]
"csv_import.py" = ["B905"]
"tests/*" = ["SIM115", "SIM117"]
